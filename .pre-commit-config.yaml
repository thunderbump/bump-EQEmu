minimum_pre_commit_version: "3.0.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-case-conflict
        stages: [commit, push]
      - id: check-merge-conflict
        stages: [commit, push]
      - id: end-of-file-fixer
        stages: [commit, push]
        exclude: |
          (?x)^(
            build(/.*)?|
            build-[^/]+(/.*)?|
            submodules(/.*)?|
            dependencies(/.*)?|
            libs(/.*)?|
            third-party(/.*)?|
            vendor(/.*)?|
            graphify-out(/.*)?|
            \\.case(/.*)?|
            generated(/.*)?|
            .*/generated(/.*)?|
            .*/generated|
            utils(/.*)?/deprecated(/.*)?
          )$
      - id: trailing-whitespace
        stages: [commit, push]
        exclude: |
          (?x)^(
            build(/.*)?|
            build-[^/]+(/.*)?|
            submodules(/.*)?|
            dependencies(/.*)?|
            libs(/.*)?|
            third-party(/.*)?|
            vendor(/.*)?|
            graphify-out(/.*)?|
            \\.case(/.*)?|
            generated(/.*)?|
            .*/generated(/.*)?|
            .*/generated|
            utils(/.*)?/deprecated(/.*)?
          )$
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.5
    hooks:
      - id: clang-format
        name: clang-format (blocking for C/C++)
        stages: [commit, push]
        files: "\\.(c|cc|cxx|cpp|h|hpp|hh|hxx)$"
        exclude: |
          (?x)^(
            build(/.*)?|
            build-[^/]+(/.*)?|
            submodules(/.*)?|
            dependencies(/.*)?|
            libs(/.*)?|
            third-party(/.*)?|
            vendor(/.*)?|
            graphify-out(/.*)?|
            \\.case(/.*)?|
            generated(/.*)?|
            .*/generated(/.*)?|
            .*/generated|
            utils(/.*)?/deprecated(/.*)?
          )$
  # ADR 0007: advisory analyzers stay manual-only for now.
  # If they move anywhere later, prefer non-blocking CI over pre-push.
  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy (manual advisory)
        entry: clang-tidy
        language: system
        args:
          - --quiet
          - -p
          - build
        files: "\\.(c|cc|cxx|cpp|h|hpp|hh|hxx)$"
        stages: [manual]
        exclude: |
          (?x)^(
            build(/.*)?|
            build-[^/]+(/.*)?|
            submodules(/.*)?|
            dependencies(/.*)?|
            libs(/.*)?|
            third-party(/.*)?|
            vendor(/.*)?|
            graphify-out(/.*)?|
            \\.case(/.*)?|
            generated(/.*)?|
            .*/generated(/.*)?|
            .*/generated|
            utils(/.*)?/deprecated(/.*)?
          )$
      - id: cppcheck
        name: cppcheck (manual advisory)
        entry: cppcheck
        language: system
        args:
          - --project=build/compile_commands.json
          - --enable=warning,performance,portability
          - --error-exitcode=1
        files: "\\.(c|cc|cxx|cpp|h|hpp|hh|hxx)$"
        stages: [manual]
        exclude: |
          (?x)^(
            build(/.*)?|
            build-[^/]+(/.*)?|
            submodules(/.*)?|
            dependencies(/.*)?|
            libs(/.*)?|
            third-party(/.*)?|
            vendor(/.*)?|
            graphify-out(/.*)?|
            \\.case(/.*)?|
            generated(/.*)?|
            .*/generated(/.*)?|
            .*/generated|
            utils(/.*)?/deprecated(/.*)?
          )$
      - id: include-what-you-use
        name: include-what-you-use (manual advisory)
        entry: include-what-you-use
        language: system
        args:
          - -p
          - build
        files: "\\.(c|cc|cxx|cpp|h|hpp|hh|hxx)$"
        stages: [manual]
        exclude: |
          (?x)^(
            build(/.*)?|
            build-[^/]+(/.*)?|
            submodules(/.*)?|
            dependencies(/.*)?|
            libs(/.*)?|
            third-party(/.*)?|
            vendor(/.*)?|
            graphify-out(/.*)?|
            \\.case(/.*)?|
            generated(/.*)?|
            .*/generated(/.*)?|
            .*/generated|
            utils(/.*)?/deprecated(/.*)?
          )$
