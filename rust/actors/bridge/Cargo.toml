[package]
name = "actor-bridge"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
actor-core = { path = "../core" }
cxx = "=1.0.194"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }

[build-dependencies]
cxx-build = "=1.0.194"
